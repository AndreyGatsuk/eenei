name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache pinned VS Code grammars
        uses: actions/cache@v4
        with:
          path: .cache/grammars
          key: vscode-grammars-${{ hashFiles('scripts/coverage/catalogs/vscode.json', 'scripts/grammars.js', 'scripts/grammar-cache.js') }}
      - run: npm ci
      - run: npm run report -- --no-editor --strict
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-coverage
          path: |
            reports/coverage.html
            reports/coverage.json
            reports/checks.log
          retention-days: 7
      - run: npm run package
      - name: Verify generated files are committed
        run: git diff --exit-code -- README.md assets/palettes vscode/package.json vscode/themes
