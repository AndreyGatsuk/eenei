name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify release version and source
        run: |
          node <<'JS'
          const { version } = require('./vscode/package.json');
          if (process.env.GITHUB_REF !== 'refs/tags/v' + version) {
            throw new Error('Run this workflow on the v' + version + ' tag matching vscode/package.json');
          }
          JS
          git merge-base --is-ancestor HEAD origin/main
      - name: Cache pinned VS Code grammars
        uses: actions/cache@v6.1.0
        with:
          path: .cache/grammars
          key: vscode-grammars-${{ hashFiles('scripts/coverage/catalogs/vscode.json', 'scripts/grammars.js', 'scripts/grammar-cache.js') }}
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Verify generated files are committed
        run: git diff --exit-code -- README.md assets/palettes vscode/package.json vscode/themes
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: eenei-vsix
          path: dist/eenei.vsix
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: eenei-vsix
          path: dist
      - name: Create release and attach VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/eenei.vsix --clobber
          else
            gh release create "$RELEASE_TAG" dist/eenei.vsix \
              --verify-tag --generate-notes --title "Eenei $RELEASE_TAG" \
              --notes 'Download eenei.vsix below and install it using Extensions: Install from VSIX in Visual Studio Code. Includes Rose, Dahlia, Lilac and Hellebore palettes in Dark and Light.'
          fi

  marketplace:
    name: Visual Studio Marketplace
    needs: [build, github-release]
    if: vars.PUBLISH_MARKETPLACE == 'true' && !github.event.repository.private
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: eenei-vsix
          path: dist
      - run: npx --yes @vscode/vsce@^4.1.0 publish --oidc --packagePath dist/eenei.vsix

  open-vsx:
    name: Open VSX
    needs: [build, github-release]
    if: vars.PUBLISH_OPEN_VSX == 'true' && !github.event.repository.private
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: eenei-vsix
          path: dist
      - run: npx --yes ovsx@^1.3.0 publish --trusted-publishing dist/eenei.vsix
