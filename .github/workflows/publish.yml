name: publish

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Cache pinned VS Code grammars
        uses: actions/cache@v6.1.0
        with:
          path: .cache/grammars
          key: vscode-grammars-${{ hashFiles('scripts/coverage/catalogs/vscode.json', 'scripts/grammars.js', 'scripts/grammar-cache.js') }}
      - run: npm ci
      - run: npm run check
      - run: npm run package

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@^4.1.0 publish --oidc --packagePath dist/eenei.vsix

      - name: Publish to Open VSX
        run: npx --yes ovsx@^1.3.0 publish --trusted-publishing --packagePath dist/eenei.vsix
