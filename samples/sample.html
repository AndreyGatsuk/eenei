<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eenei — Projects</title>
    <link rel="stylesheet" href="sample.css">
  </head>
  <body>
    <!-- Semantic markup with attributes, entities and inline code. -->
    <main class="projects" aria-labelledby="title">
      <h1 id="title">Projects &amp; activity</h1>
      <p>Open <code>compose.yaml</code> to configure services.</p>
      <form action="/search" method="get">
        <label for="query">Find a project</label>
        <input id="query" name="query" type="search" required>
        <button type="submit">Search</button>
      </form>
      <a href="https://example.com/projects">Browse all projects &rarr;</a>
    </main>
  </body>
</html>
